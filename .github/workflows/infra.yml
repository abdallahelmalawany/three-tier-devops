# Infrastructure pipeline
#   push / PR touching infra/  -> fmt check, validate, Checkov security scan
#   manual run (workflow_dispatch) -> plan / apply / destroy against AWS
#
# Applying infrastructure is deliberately manual: an infra change should be
# reviewed as a plan first, while application deploys are fully automatic.
#
# Configuration:
#   vars.TF_STATE_BUCKET         bucket created by infra/bootstrap
#   vars.AWS_REGION              e.g. us-east-1
#   vars.AWS_TERRAFORM_ROLE_ARN  OIDC role with infra permissions (optional)
#   secrets.AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN (fallback)
#   vars.ALERT_EMAIL             optional alarm e-mail
name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run against the dev environment
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  validate:
    name: Format, validate & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/envs/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          # Report findings without failing: accepted sandbox trade-offs
          # (no NAT, HTTP-only, single-AZ DB) are documented in the README.
          soft_fail: true

  terraform:
    name: terraform ${{ inputs.action }}
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-access-key-id: ${{ vars.AWS_TERRAFORM_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ vars.AWS_TERRAFORM_ROLE_ARN == '' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-session-token: ${{ vars.AWS_TERRAFORM_ROLE_ARN == '' && secrets.AWS_SESSION_TOKEN || '' }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        if: inputs.action != 'destroy'
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: terraform plan -input=false -out=tfplan -var "github_repository=${{ github.repository }}"

      - name: terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -var "github_repository=${{ github.repository }}"
