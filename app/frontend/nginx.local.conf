# Local development only (mounted by docker-compose): nginx stands in for the
# ALB path rule and proxies /api/* to the backend container.
server {
    listen       8080;
    server_name  _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
