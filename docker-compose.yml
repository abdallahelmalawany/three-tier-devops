# Local environment that mirrors the AWS layout:
#   browser -> frontend (nginx, :8080) -> /api/* -> backend (:3000) -> postgres
# Usage: docker compose up --build   then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only # local throwaway value, never used in AWS
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: local-dev-only
      DB_SSL: "false"
      APP_VERSION: local
    read_only: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    ports:
      - "8080:8080"
    volumes:
      - ./app/frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db-data:
